name: Run Telegram Bot 24x7

on:
  schedule:
    - cron: '0 */6 * * *'  # Har 6 ghante baad run hoga
  workflow_dispatch: {}      # Manually start karne ke liye button

concurrency:
  group: telegram-bot-runner
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355    # 6 ghante se thoda kam (max limit 360 hai)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MONGO_URL: ${{ secrets.MONGO_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
          BOT_OWNER: ${{ secrets.BOT_OWNER }}
        run: |
          # Bot ko chalayega, agar 6 ghante me crash ho jaye toh exit code 0 dega taaki workflow fail na dikhe
          timeout 21000 python app.py || echo "Bot session ended, restarting in next schedule..."
